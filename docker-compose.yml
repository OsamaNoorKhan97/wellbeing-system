# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wellbeing
      POSTGRES_PASSWORD: wellbeing
      POSTGRES_DB: wellbeing
    ports:
      - "5432:5432"
    volumes:
      - wellbeing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellbeing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wellbeing-data:
